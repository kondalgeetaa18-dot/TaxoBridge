[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taxobridge"
version = "1.0.0"
description = "TaxoBridge: primal-dual constrained optimization with unbalanced optimal transport for cross-taxonomy emotion detection in health text"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TaxoBridge authors" }]
keywords = [
  "optimal-transport", "cross-taxonomy", "emotion-detection",
  "mental-health", "constrained-optimization", "sparsemax", "explainable-nlp",
]
dependencies = ["numpy>=1.24,<3", "scipy>=1.10", "pyyaml>=6.0"]

[project.optional-dependencies]
train = [
  "torch>=2.4,<2.6", "transformers>=4.44,<4.46", "tokenizers>=0.19",
  "scikit-learn>=1.3", "iterative-stratification>=0.1.7",
  "datasets>=2.20", "pandas>=2.0",
]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
taxobridge-verify = "taxobridge.cli:verify_entry"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
